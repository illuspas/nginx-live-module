worker_processes  1;

error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  4096;
}

rtmp {
    server {
        listen 1935;          # RTMP
        gop_cache  off;   # inherited by app "plain"

        application myapp {
            live             on;
            gop_cache        on;
            allow publish 127.0.0.1;
            allow play all;
        }

        application plain {
            live  on;
            # inherits gop_cache=off from server{}
        }

        application locked {
            live  on;
            deny all;          # every request from anywhere is refused
        }
    }
}

http {
    access_log  logs/access.log;

    server {
        listen       8080;

        location ~ ^/[a-z0-9_]+/.+(\.flv)?$ {
            live_flv  on;
        }

        location = /stat {
            live_stat  on;
        }
    }
}
